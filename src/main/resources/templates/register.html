<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title})}">
  <head>
    <title>Signup</title>
  </head>
  <body class="bg-gray-900 min-h-screen">
    <!-- Wrapper: Centered using flex and with padding to avoid navbar overlap -->
    <div id="content" class="flex justify-center items-center pt-24 px-4 min-h-screen">
      <div class="w-full max-w-xl">
        <!-- Card -->
        <div
          class="p-6 border-t-[10px] border-blue-700 bg-gray-800 rounded-xl shadow hover:bg-gray-700"
        >
          <h5 class="mb-2 text-2xl font-bold tracking-tight text-white">
            Signup Here
          </h5>
          <p class="font-normal text-gray-400">
            Start managing contacts on cloud ...
          </p>

          <!-- Form -->
          <form data-th-object="${userForm}" data-th-action="@{'/do-register'}"method="post" class="mt-5 space-y-4" novalidate>
            <!-- Name -->
            <div>
              <label for="name" class="block mb-1 text-sm font-medium text-white">Name</label>
              <input
                type="text"
                id="name"
                data-th-field="*{name}"
                class="w-full p-2.5 rounded-lg bg-gray-700 border border-gray-600 placeholder-gray-400 text-white text-sm focus:ring-blue-500 focus:border-blue-500"
                placeholder="Enter your name"
                required
              />
              <!-- <p class="text-red-600 px-1 py-2" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p> -->
            </div>

            <!-- Email -->
            <div>
              <label for="email" class="block mb-1 text-sm font-medium text-white">Email</label>
              <input
                type="email"
                id="email"
                data-th-field="*{email}"                
                class="w-full p-2.5 rounded-lg bg-gray-700 border border-gray-600 placeholder-gray-400 text-white text-sm focus:ring-blue-500 focus:border-blue-500"
                placeholder="name@example.com"
                required
              />
             
            </div>

            <!-- Password -->
            <div>
              <label for="password" class="block mb-1 text-sm font-medium text-white">New Password</label>
              <input
                type="password"
                id="password"
                data-th-field="*{password}"
                class="w-full p-2.5 rounded-lg bg-gray-700 border border-gray-600 placeholder-gray-400 text-white text-sm focus:ring-blue-500 focus:border-blue-500"
                required
              />
              <p class="text-red-600 px-1 py-2"></p>
            </div>

            <!-- Phone -->
            <div>
              <label for="phone" class="block mb-1 text-sm font-medium text-white">Contact Number</label>
              <input
                type="text"
                id="phone"
                data-th-field="*{phoneNumber}"
                class="w-full p-2.5 rounded-lg bg-gray-700 border border-gray-600 placeholder-gray-400 text-white text-sm focus:ring-blue-500 focus:border-blue-500"
                required
              />
              <p class="text-red-600 px-1 py-2"></p>
            </div>

            <!-- About -->
            <div>
              <label for="about" class="block mb-1 text-sm font-medium text-white">Write something about yourself</label>
              <textarea
                id="about"
                data-th-field="*{about}"
                rows="4"
                class="w-full p-2.5 rounded-lg bg-gray-700 border border-gray-600 placeholder-gray-400 text-white text-sm focus:ring-blue-500 focus:border-blue-500"
                placeholder="Write here..."
              ></textarea>
              <p class="text-red-600 px-1 py-2"></p>
            </div>

            <!-- Buttons -->
            <div class="flex justify-center space-x-3">
              <button
                type="submit"
                class="px-4 py-2 rounded bg-blue-800 hover:bg-blue-700 text-white"
              >
                Signup
              </button>
              <button
                type="reset"
                class="px-4 py-2 rounded bg-orange-800 hover:bg-orange-700 text-white"
              >
                Reset
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      console.log("Signup page");
    </script>
  </body>
</html>
